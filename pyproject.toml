[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-lab"
version = "0.2.0"
description = "Normal-reference visual anomaly inspection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = ["numpy==2.2.6", "Pillow==11.2.1", "scipy==1.17.1", "scikit-learn==1.6.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
patchcore = ["anomalib==2.2.0", "torch==2.6.0", "torchvision==0.21.0", "timm==1.0.30"]

[project.scripts]
inspection = "inspection.cli:main"

[tool.setuptools.packages.find]
include = ["inspection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
