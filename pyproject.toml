[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-lab"
version = "0.4.2"
description = "Reproducible normal-reference inspection and controlled anomaly-detection experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "anomalib==2.2.0", "torch==2.6.0", "torchvision==0.21.0", "timm==1.0.30",
  "numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1", "scipy==1.17.1",
  "Pillow==11.2.1", "streamlit==1.45.1", "plotly==6.1.2", "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
patchcore = []
ui = []

[project.scripts]
inspection = "inspection.cli:main"
inspection-predict = "inspection.predict:main"
inspection-doctor = "inspection.doctor:main"

[tool.setuptools.packages.find]
include = ["inspection*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
